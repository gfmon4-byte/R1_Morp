<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ออฟไลน์ — RunMorp</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Mali:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Mali', system-ui, sans-serif;
      background: #FFF8F4;
      color: #4A3B52;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 360px;
    }

    .emoji {
      font-size: 72px;
      margin-bottom: 24px;
      display: block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    h1 {
      font-family: 'Baloo 2', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: #FF8FA3;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      color: #7C6B84;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #FF8FA3, #7FDBB6);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,143,163,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255,143,163,0.45);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">🏃‍♀️</span>
    <h1>ไม่มีอินเทอร์เน็ต</h1>
    <p>RunMorp ต้องการการเชื่อมต่ออินเทอร์เน็ตเพื่อโหลดข้อมูล<br/>กรุณาตรวจสอบการเชื่อมต่อและลองใหม่อีกครั้ง 🌸</p>
    <a class="btn" href="/" onclick="window.location.reload(); return false;">
      🔄 ลองใหม่
    </a>
  </div>
</body>
</html>
